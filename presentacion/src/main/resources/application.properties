spring.application.name=calendariolaboral

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/calendariolaboral
spring.datasource.username=postgres
spring.datasource.password=saraarsa

# Configuracion Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URL Base fija de la API Festivos externa
api.festivos.url=http://localhost:3000/festivos